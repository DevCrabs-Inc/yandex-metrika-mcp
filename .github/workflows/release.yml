name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Current LTS: its npm (11.x) supports trusted publishing, which needs npm 11.5.1+.
          node-version: 26
          # No `cache` input: release builds do not reuse a dependency cache.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm build
      - run: pnpm mcpb
      - name: Checksums
        run: cd build && sha256sum *.mcpb > SHA256SUMS
      - name: Pack the package that CI tested
        run: pnpm pack --out package.tgz
      - name: Publish to npm
        # npm, not pnpm: npm 11 exchanges the GitHub OIDC token itself when a trusted
        # publisher is configured for the package; until then NPM_TOKEN is used.
        # npm supports provenance only from public repositories.
        # A version already on npm (for example published by hand with 2FA) is skipped,
        # so the rest of the release can run. While no stable version exists, a
        # prerelease is also `latest`, so `npx -y <package>` from the docs installs it.
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
            exit 0
          fi
          tag=latest
          case "$version" in
            *-*)
              stable="$(npm view "$name" dist-tags.latest 2> /dev/null || true)"
              case "$stable" in "" | *-*) tag=latest ;; *) tag=next ;; esac
              ;;
          esac
          npm publish package.tgz --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > build/RELEASE_NOTES.md
          test -s build/RELEASE_NOTES.md
      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: build/RELEASE_NOTES.md
          files: |
            build/*.mcpb
            build/SHA256SUMS

  # Separate job: the registry entry can also be published again from main
  # (Actions > MCP Registry > Run workflow) without moving the release tag.
  registry:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
