name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Current LTS: its npm (11.x) supports trusted publishing, which needs npm 11.5.1+.
          node-version: 26
          # No `cache` input: release builds do not reuse a dependency cache.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm build
      - run: pnpm mcpb
      - name: Checksums
        run: cd build && sha256sum *.mcpb > SHA256SUMS
      - name: Pack the package that CI tested
        run: pnpm pack --out package.tgz
      - name: Publish to npm
        # npm, not pnpm: npm 11 exchanges the GitHub OIDC token itself when a trusted
        # publisher is configured for the package; until then NPM_TOKEN is used.
        # npm supports provenance only from public repositories.
        run: npm publish package.tgz --access public --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
      - name: Make the package installable without a version
        # Prereleases go to the `next` tag. While no stable version exists, also point
        # `latest` at the release so `npx -y <package>` from the docs works.
        if: contains(github.ref_name, '-')
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          latest="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
          case "$latest" in
            "" | *-*) npm dist-tag add "$name@$version" latest ;;
            *) echo "latest is the stable $latest; leaving it" ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/*.mcpb
            build/SHA256SUMS
      - name: Publish to the MCP Registry
        env:
          # Pinned and verified: never run whatever "latest" happens to be (06).
          MCP_PUBLISHER_VERSION: v1.8.8
          MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
