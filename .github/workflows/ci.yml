name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 is the oldest supported runtime (engines), 26 the current LTS.
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test the bundle
        run: node dist/cli.js doctor
        env:
          YM_MCP_SECRET_STORE: file

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Users may still run the oldest supported Node: install the package there.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install from the packed tarball (T33)
        run: |
          pnpm pack --out package.tgz
          mkdir /tmp/clean && cd /tmp/clean && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/package.tgz"
          npx yandex-metrika-mcp --version
          YM_MCP_SECRET_STORE=file npx yandex-metrika-mcp demo
      - name: Bundle size limit
        run: node scripts/check-bundle-size.mjs
      - name: MCP over stdio from the installed package (T33)
        run: pnpm vitest run test/e2e/stdio.test.ts
        env:
          YM_MCP_E2E_BIN: /tmp/clean/node_modules/@dev-crabs/yandex-metrika-mcp/dist/cli.js
      - run: pnpm mcpb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcpb
          path: build/*.mcpb
